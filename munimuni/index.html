<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1fa">
<title>ほっぺ、引っぱるな。｜画像ワープ実験室</title>
<style>
:root { color-scheme:light; --ink:#39354a; --muted:#76718a; --lav:#84789e; --blue:#7993b3; }
* { box-sizing:border-box; }
body { margin:0; min-height:100dvh; color:var(--ink); background:radial-gradient(circle at 12% 4%,#fff 0,transparent 30%),radial-gradient(circle at 90% 100%,#dce7f1 0,transparent 35%),linear-gradient(152deg,#f1eafa 0%,#f8f5f1 60%,#e8eef6 100%); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
main { max-width:680px; margin:auto; padding:24px 14px 38px; }
.eyebrow { display:flex; gap:12px; align-items:center; justify-content:center; font-size:10px; font-weight:800; letter-spacing:.24em; color:#9186a4; }
.eyebrow:before,.eyebrow:after { content:""; height:1px; width:22px; background:#b9aaca; }
h1 { font-family:Georgia,"Hiragino Mincho ProN",serif; text-align:center; font-weight:600; font-size:clamp(27px,6vw,40px); letter-spacing:.045em; margin:10px 0 5px; }
.subtitle { color:#77718b; font-size:13px; line-height:1.8; text-align:center; margin:0 0 17px; }
.game { padding:16px 14px 20px; border:1px solid #ffffffeb; background:#ffffffad; box-shadow:0 18px 50px #8f80b220; backdrop-filter:blur(7px); border-radius:28px; }
.bubble { min-height:47px; max-width:95%; width:fit-content; margin:0 auto 8px; padding:12px 18px; border:1px solid #e5e0ec; background:white; border-radius:16px 16px 16px 4px; text-align:center; font-size:14px; font-weight:650; box-shadow:0 6px 24px #7764900d; }
.stage { position:relative; width:100%; max-width:520px; margin:auto; aspect-ratio:520/490; overflow:hidden; border-radius:17px; background:radial-gradient(circle at center,#f9f5ff,#ece9f4); box-shadow:inset 0 0 0 1px #c4b8d226; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }
.stage:active { cursor:grabbing; }
canvas { display:block; width:100%; height:100%; touch-action:none; }
.helper { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:#fffc; color:#665e78; border:1px solid #fff; backdrop-filter:blur(4px); padding:6px 12px; border-radius:50px; font-size:11px; white-space:nowrap; pointer-events:none; transition:opacity .3s; }
.hint { margin:13px auto; color:#706981; line-height:1.7; text-align:center; font-size:12px; }
.tools { display:flex; justify-content:center; align-items:center; gap:9px; flex-wrap:wrap; border-top:1px solid #e9e2ee; padding-top:15px; }
button,.upload { display:inline-flex; align-items:center; justify-content:center; font:inherit; font-size:13px; font-weight:650; color:#665a7b; padding:10px 16px; border:1px solid #ccc2de; border-radius:100px; background:white; cursor:pointer; min-height:42px; }
.upload { background:#776b94; border-color:#776b94; color:white; }
button:hover,.upload:hover { filter:brightness(.97); }
button:focus-visible,.upload:focus-within { outline:2px solid #678cb6; outline-offset:2px; }
.upload input { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
.controls { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:12px; padding-top:14px; color:#665f78; font-size:12px; }
.controls input { accent-color:#9280af; width:130px; }
.counter { text-align:center; padding-top:13px; font-size:12px; color:#867b96; }
.counter strong { font-size:16px; font-variant-numeric:tabular-nums; }
.footnote { margin:17px auto 0; font-size:11px; text-align:center; line-height:1.8; color:#867f93; }
.error { padding:12px; font-size:13px; text-align:center; color:#8e4a56; display:none; }
@media(max-width:430px) {main{padding:16px 10px 30px} .game{padding:12px 8px 17px;border-radius:23px} .stage{border-radius:13px} .bubble{font-size:13px} }
</style>
</head>
<body>
<main>
  <div class="eyebrow">IMAGE WARP EXPERIMENT</div>
  <h1>ほっぺ、引っぱるな。</h1>
  <p class="subtitle">画像の好きな場所を指で押して、そのまま動かしてみろ。</p>
  <section class="game" aria-label="画像を触って変形させる実験">
    <div id="bubble" class="bubble" aria-live="polite">……おい。今度は画像ごと引っぱるつもりか。</div>
    <div class="stage" id="stage"><canvas id="canvas" aria-label="画像をドラッグすると触った場所が伸び、離すと元に戻ります"></canvas><div class="helper" id="helper">☝ 頬を引っぱってみろ</div></div>
    <p class="hint">頬を押すとむにっ。引っぱるとびよーん。<br>ほかの画像でも試せるぞ。</p>
    <div class="tools">
      <label class="upload">画像を選ぶ <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" aria-label="画像ファイルを選ぶ"></label>
      <button id="sample" type="button">サンプルに戻す</button>
      <button id="reset" type="button">変形を戻す</button>
    </div>
    <div class="controls"><label for="radius">変形する範囲</label><input id="radius" type="range" min="10" max="35" step="1" value="21"><span id="radLabel">21%</span></div>
    <div class="counter"><strong id="counter">0</strong> 回いじられた</div>
    <div id="error" class="error" role="alert"></div>
  </section>
  <p class="footnote">PNG・JPG・WebPなどを読み込んで直接変形。<br>画像は端末内だけで処理し、外部に送信しない。HTMLひとつで動作。</p>
</main>

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  if(Math.abs(drag[0])+Math.abs(drag[1])+Math.abs(press) < .001) {
    ctx.drawImage(original,0,0,W,H);return;
  }
  const aspect=W/H;
  const r=Math.max(.03,radius);
  const newGrid=[];
  for(let y=0;y<=rows;y++){
    const row=[];
    for(let x=0;x<=cols;x++){
      const [u,v]=grid[y][x];
      const correctedX=(u-anchor[0])*aspect;
      const correctedY=v-anchor[1];
      const distSq=correctedX*correctedX+correctedY*correctedY;
      const weight=Math.exp(-2*distSq/(r*r));
      const xx=u+drag[0]*weight-(u-anchor[0])*press*weight*.7;
      const yy=v+drag[1]*weight-(v-anchor[1])*press*weight*.7;
      row.push([xx*W,yy*H]);
    }
    newGrid.push(row);
  }
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const a=[grid[j][i][0]*W,grid[j][i][1]*H];
    const b=[grid[j][i+1][0]*W,grid[j][i+1][1]*H];
    const c=[grid[j+1][i][0]*W,grid[j+1][i][1]*H];
    const d=[grid[j+1][i+1][0]*W,grid[j+1][i+1][1]*H];
    const A=newGrid[j][i],B=newGrid[j][i+1],C=newGrid[j+1][i],D=newGrid[j+1][i+1];
    transformTriangle([a,b,c],[A,B,C]);
    transformTriangle([b,d,c],[B,D,C]);
  }
}
let timeOfLastDraw=0;
function animate(now){
  let movement=0;
  for(let i=0;i<2;i++){
    velocity[i]=(velocity[i]+(target[i]-drag[i])*.19)*.75;
    drag[i]+=velocity[i];
    movement+=Math.abs(velocity[i])+Math.abs(target[i]-drag[i]);
  }
  pressVelocity=(pressVelocity+(pressTarget-press)*.21)*.72;
  press+=pressVelocity;
  movement+=Math.abs(pressVelocity)+Math.abs(pressTarget-press);
  if(original && (dirty || movement>.0005)) {
    // At most 40 frames per second: enough for a springy drag on mobile.
    if(now-timeOfLastDraw>25){draw();dirty=false;timeOfLastDraw=now;}
  } else if(original && movement<=.0005 && !dirty && (Math.abs(drag[0])+Math.abs(drag[1])+Math.abs(press)>.001)){
    drag=[0,0];velocity=[0,0];press=0;pressVelocity=0;draw();
  }
  requestAnimationFrame(animate);
}
stage.addEventListener('pointerdown',start);
stage.addEventListener('pointermove',move);
stage.addEventListener('pointerup',end);
stage.addEventListener('pointercancel',end);
stage.addEventListener('lostpointercapture',(e)=>{if(active && active.id===e.pointerId){target=[0,0];pressTarget=0;active=null}});
document.querySelector('#reset').addEventListener('click',()=>{reset();talk('ようやく元に戻したか。')});
document.querySelector('#sample').addEventListener('click',()=>{if(imgURL){URL.revokeObjectURL(imgURL);imgURL=null;}openImage(sample);talk('……また俺か。')});
document.querySelector('#file').addEventListener('change',(event)=>{
  const file=event.target.files?.[0];if(!file)return;
  if(imgURL)URL.revokeObjectURL(imgURL);
  imgURL=URL.createObjectURL(file);openImage(imgURL);talk('今度はこの画像か。');
});
radiusEl.addEventListener('input',()=>{radius=Number(radiusEl.value)/100;radiusLabel.textContent=radiusEl.value+'%';dirty=true});
if(!ctx){report('このブラウザではCanvasの描画を使えない。');return;}
setGrid();openImage(sample);requestAnimationFrame(animate);
})();

</script>
